# ============================================================================
# goder 持续集成 / 持续交付(Wails v3 桌面 App;三平台 × 双架构)
# 产物:macOS .app(darwin 双架构 zig cc 交叉 + ldid adhoc 签名)、
#      Linux zip(linux 原生架构 CGO + Debian multiarch 交叉另一架构,
#      zip 只含 goder,运行需 GTK4/WebKitGTK;gh 由 App 首次启动静默
#      自动下载)、
#      Windows zip(wails v3 windows 前端纯 syscall 无 CGO,直接交叉;
#      zip 只含 goder.exe,gh 由 App 首次启动弹框自动下载)。产物目录名与
#      gh 下载侧平台目录一致。
# 触发方式:推送 tag(git tag v0.1.0 && git push origin v0.1.0)
#          仅 tag 触发;普通分支推送不创建任何 job(runner 为低性能单并发机,
#          不浪费槽位)
# 流程:    alpine node 编译前端 -> trixie go 交叉编译 wails3 darwin(arm64+amd64)
#          -> 从 download.gorun.fun 下载 gh(grf-harness) darwin 最新版捆绑
#             进 .app(不从源码构建;Linux/Windows 不捆绑,App 首启自动下载)
#          -> 组装 Goder.app(Info.plist 模板 + 仓库内 AppIcon.icns,
#             ldid 补 adhoc 签名)-> zip 按平台/版本目录 scp 发布到 10.8.0.5:
#             /data/download/goder/{目标平台}/{版本号}/goder-*.zip
#             版本号不取本仓库 tag:跟随 grf-harness 最新发布 tag;gh 不变
#             而本程序再发版时追加 .postN(推算在 scripts/version.sh,与本地
#             build.sh 同源;build 阶段写入 bin/VERSION 供 publish 读取)。
#
# 编译镜像:
#   node:24-alpine3.24       前端(vite)
#   goder-builder:1.26       后端(基于 golang:1.26-trixie 的专用镜像,
#     Dockerfile 在 ci/Dockerfile,runner 宿主机构建、同机 if-not-present 拉取):
#     内含 GTK/WebKitGTK dev、linux arm64 交叉 gcc + 预解包 sysroot(/opt/xs)、
#     darwin 交叉工具链 zig+macOS SDK+ldid 与 zcc 包装器(/opt/mc)。
#     darwin 产物为 zig cc 交叉(wails darwin 端是 Objective-C CGO,Linux 上
#     没有 clang/macOS 工具链只能走 zig),ldid 补 adhoc 签名 —— 等价本地
#     build.sh 里 codesign -f -s - 的作用(不签名的 arm64 macho 在 Apple
#     Silicon 上会被内核直接 SIGKILL)。改依赖后重构建镜像并 bump tag。
#
# 与本地 build.sh 的差异:CI 的 Linux runner 上没有 qlmanage/sips/iconutil,
# 图标不能用 frontend/public/icon.svg 现场生成,用仓库内预生成的
# build/darwin/AppIcon.icns(本地改图标后需重新生成提交,见 build.sh 注释)。
#
# 发布侧需在 GitLab CI/CD Variables 配置文件型变量:
#   DEPLOY_SSH_PRIVATE_KEY (发布机 SSH 私钥,类型选 File) —— 与 g-term 共用
# ============================================================================

image: golang:1.26-trixie

variables:
  # 发布目标主机(内网,通过 SSH 登录)与产物目录,同 g-term 的发布机
  DEPLOY_HOST: 10.8.0.5
  DEPLOY_DIR: /data/download/goder
  DEPLOY_USER: root
  GOPROXY: "https://goproxy.cn,direct"
  # gh(grf-harness)已发布产物的下载基地址:其下 {平台}/{版本}/gh
  GH_DL_BASE: https://download.gorun.fun/grf-harness
  # Go 构建缓存放进工作区,经 cache 跨 job/版本复用(docker 执行器每 job 全新
  # 容器,默认 GOCACHE 随容器丢弃,导致每次冷编译全部标准库 + wails 依赖)
  GOCACHE: $CI_PROJECT_DIR/.gocache
  GOMODCACHE: $CI_PROJECT_DIR/.gomodcache

stages:
  - frontend
  - build
  - publish

# ------------------------------ alpine node:前端 vite ---------------------
build-frontend:
  stage: frontend
  image: node:24-alpine3.24
  tags:
    - home
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [.npmcache/]
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npmcache"
  script:
    - npm config set registry https://registry.npmmirror.com
    - cd frontend
    - npm ci
    - npm run build          # vite build -> frontend/dist(go:embed 输入)
  artifacts:
    paths: [frontend/dist/]
    # 仅够 build 消费,过期即清,少占 runner/GitLab 存储
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_TAG'

# --------- goder-builder 镜像:下载 gh 最新版 + 三平台双架构交叉编译 ----------
build:
  stage: build
  # 专用编译镜像(构建方法见 ci/Dockerfile 头注释,在 runner 宿主机构建;
  # 与 runner 同机 + if-not-present 拉取,无需 registry):内含 GTK/WebKitGTK
  # dev、linux arm64 交叉 gcc + 预解包 sysroot(/opt/xs/arm64)、darwin 交叉
  # 工具链 zig+macOS SDK+ldid 与 zcc 包装器(/opt/mc)。改动依赖后重构建
  # 镜像并 bump 此处 tag。
  image: goder-builder:1.26
  tags:
    - home
  cache:
    # 固定 key:缓存跨版本 tag 累积复用;Go 版本升级后需换 key 迫使重建,
    # 防旧缓存与新工具链混用
    key: goder-go-build-1.26
    paths:
      - .gocache/
      - .gomodcache/
  before_script:
    # 交叉方向按 host 架构推导;arm64 host 无预烤 sysroot 时 script 内现建
    - |
      case "$(uname -m)" in
        aarch64) CROSS_DEB=amd64; CROSS_TRIPLE=x86_64-linux-gnu ;;
        *)       CROSS_DEB=arm64; CROSS_TRIPLE=aarch64-linux-gnu ;;
      esac
  script:
    - go vet ./...
    # 版本号跟随 grf-harness 最新发布 tag(gh 不变而本程序再发版追加 .postN)
    - VERSION=$(sh scripts/version.sh)
    - echo "Goder 版本 $VERSION"
    # ---- gh:直接下载 grf-harness 各平台最新发布版(不从源码构建) ----
    # 目录列表页是静态 HTML,版本号目录 sort -V 取最大;两架构共用同一版本,
    # 以 macos-arm64 的列表为准(macos/amd64 目录可能滞后半拍,先探测存在)
    - |
      GH_VERSION=$(curl -fsSL ${GH_DL_BASE}/macos-arm64/ | grep -oE 'href="[0-9][^"/]*/"' | cut -d'"' -f2 | tr -d / | sort -V | tail -1)
      [ -n "$GH_VERSION" ] || { echo "获取 gh 最新版本失败"; exit 1; }
      echo "捆绑 gh 版本: $GH_VERSION"
      mkdir -p bin
      curl -fsSL -o bin/gh-darwin-arm64 ${GH_DL_BASE}/macos-arm64/${GH_VERSION}/gh
      curl -fsSL -o bin/gh-darwin-amd64  ${GH_DL_BASE}/macos/${GH_VERSION}/gh
      # linux 目录名:amd64 → linux,arm64 → linux-arm64(与 gh 下载侧一致)
      case "$(uname -m)" in
        aarch64) NATIVE_ARCH=arm64; CROSS_ARCH=amd64 ;;
        *)       NATIVE_ARCH=amd64; CROSS_ARCH=arm64 ;;
      esac
      chmod +x bin/gh-darwin-*
    # ---- linux 双架构:原生 CGO + 交叉(sysroot) ----
    # | 交叉侧:foreign-arch 的 GTK/WebKitGTK dev 包与原生 -dev 自冲突,不能
    # | apt 安装。镜像已预解包 arm64 闭包 sysroot(/opt/xs/arm64,amd64 host);
    # | 其余情况(arm64 host)现场解析闭包下载解包到 .ci-cache。
    # | pkg-config 以 SYSROOT_DIR 前缀出 -I/-L;ld 对 .so 的间接依赖
    # | (DT_NEEDED)不搜 -L 目录,需 CGO_LDFLAGS 补 -rpath-link 指向 sysroot
    # | 与交叉工具链库目录;运行库仍用目标机系统库。
    - |
      CGO_ENABLED=1 go build -tags production -trimpath -buildvcs=false -ldflags "-s -w" -o bin/goder-linux-${NATIVE_ARCH} .
      XS="/opt/xs/${CROSS_DEB}"
      if [ ! -d "$XS/usr/lib/${CROSS_TRIPLE}/pkgconfig" ]; then
        XS="$CI_PROJECT_DIR/.ci-cache/xs2/${CROSS_DEB}"
        rm -rf "$XS" /xsapt && mkdir -p "$XS" /xsapt/lists/partial /xsapt/cache/archives/partial /xsapt/dpkg
        : > /xsapt/dpkg/status
        sed -i 's/deb.debian.org/mirrors.aliyun.com/g' /etc/apt/sources.list.d/debian.sources || true
        XOPTS="-o Dir::State=/xsapt -o Dir::Cache=/xsapt/cache -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/debian.sources -o Dir::Etc::sourceparts=/dev/null -o Dir::State::status=/xsapt/dpkg/status -o APT::Architecture=${CROSS_DEB} -o APT::Architectures=${CROSS_DEB}"
        apt-get $XOPTS update -qq
        mkdir -p /xsapt/debs && cd /xsapt/debs
        apt-get $XOPTS --print-uris -y --no-install-recommends install libgtk-4-dev libwebkitgtk-6.0-dev \
          | grep -oE "'https?://[^']+'" | tr -d "'" > /tmp/urls.txt
        # 逐个下载并校验数量:任何一个失败/缺失都中止,避免不完整 sysroot 进缓存
        xargs -r -n1 curl -fsSLO < /tmp/urls.txt
        GOT=$(ls *.deb | wc -l); WANT=$(wc -l < /tmp/urls.txt)
        [ "$GOT" = "$WANT" ] || { echo "deb 下载不完整 $GOT/$WANT"; exit 1; }
        for d in *.deb; do dpkg -x "$d" "$XS"; done
        cd "$CI_PROJECT_DIR"
      fi
      # libc6-dev-*-cross 的 libc.so 链接脚本写死目标机绝对路径(/lib/<triple>/
      # libc.so.6、/lib/ld-linux-*.so),容器里没有,补符号链接到交叉工具链目录。
      mkdir -p /lib/${CROSS_TRIPLE} /usr/lib/${CROSS_TRIPLE}
      for f in /usr/${CROSS_TRIPLE}/lib/libc.so.6 /usr/${CROSS_TRIPLE}/lib/libc_nonshared.a; do
        [ -e "$f" ] && ln -sf "$f" /lib/${CROSS_TRIPLE}/ && ln -sf "$f" /usr/lib/${CROSS_TRIPLE}/
      done
      ln -sf /usr/${CROSS_TRIPLE}/lib/ld-linux-*.so* /lib/ 2>/dev/null || true
      CC=${CROSS_TRIPLE}-gcc \
      PKG_CONFIG_LIBDIR=$XS/usr/lib/${CROSS_TRIPLE}/pkgconfig:$XS/usr/share/pkgconfig \
      PKG_CONFIG_SYSROOT_DIR=$XS \
      CGO_LDFLAGS="-Wl,-rpath-link,$XS/usr/lib/${CROSS_TRIPLE} -Wl,-rpath-link,/usr/${CROSS_TRIPLE}/lib" \
      CGO_ENABLED=1 GOOS=linux GOARCH=${CROSS_ARCH} \
        go build -tags production -trimpath -buildvcs=false -ldflags "-s -w" -o bin/goder-linux-${CROSS_ARCH} .
      for ARCH in ${NATIVE_ARCH} ${CROSS_ARCH}; do
        rm -rf .linstage && mkdir .linstage
        # 不捆绑 gh:App 启动时检测到缺失会静默自动下载当前系统版本(见
        # internal/desktop/ghdownload_linux.go),zip 只含 goder。
        cp bin/goder-linux-${ARCH} .linstage/goder
        (cd .linstage && zip -qry ../bin/goder-linux-${ARCH}.zip goder)
      done
      rm -rf .linstage
    # ---- windows 双架构:wails v3 windows 前端为纯 syscall,无 CGO,直接交叉 ----
    # 不捆绑 gh:App 启动时检测到缺失会弹框自动下载当前系统版本(见
    # internal/desktop/ghdownload_windows.go),zip 只含 goder.exe。
    # -H windowsgui:GUI 程序不弹控制台;图标与 manifest 由仓库根的
    # rsrc_windows_{amd64,arm64}.syso 提供(go build 自动链接)。
    - |
      for ARCH in amd64 arm64; do
        CGO_ENABLED=0 GOOS=windows GOARCH=${ARCH} \
          go build -tags production -trimpath -buildvcs=false -ldflags "-s -w -H windowsgui" -o bin/goder-windows-${ARCH}.exe .
        rm -rf .winstage && mkdir .winstage
        cp bin/goder-windows-${ARCH}.exe .winstage/goder.exe
        (cd .winstage && zip -qry ../bin/goder-windows-${ARCH}.zip goder.exe)
      done
      rm -rf .winstage
    # ---- darwin 交叉:zig cc + macOS SDK + ldid 均已预置镜像 /opt/mc ----
    - CC=/opt/mc/bin/zcc-darwin-arm64 GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -tags production -trimpath -buildvcs=false -ldflags "-s -w" -o bin/goder-darwin-arm64 .
    - CC=/opt/mc/bin/zcc-darwin-amd64 GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build -tags production -trimpath -buildvcs=false -ldflags "-s -w" -o bin/goder-darwin-amd64 .
    # adhoc 重签(链接器签名在文件复制后可能失效;gh 下载件同样补签一次)
    - '/opt/mc/bin/ldid -S bin/goder-darwin-arm64 2>/dev/null || echo "WARN arm64 adhoc 签名未执行"'
    - '/opt/mc/bin/ldid -S bin/goder-darwin-amd64 2>/dev/null || echo "WARN amd64 adhoc 签名未执行"'
    - '/opt/mc/bin/ldid -S bin/gh-darwin-arm64 2>/dev/null || true'
    - '/opt/mc/bin/ldid -S bin/gh-darwin-amd64 2>/dev/null || true'
    # ---- 组装 .app 并 zip:plist 版本号用 version.sh 推算值;gh 捆绑进 MacOS/ ----
    - |
      chmod +x bin/*
      [ -n "$VERSION" ] || VERSION="0.1.0"
      echo "$VERSION" > bin/VERSION
      for ARCH in arm64 amd64; do
        rm -rf .appstage
        mkdir -p .appstage/goder.app/Contents/MacOS .appstage/goder.app/Contents/Resources
        sed -e "s/0.1.0/${VERSION}/g" build/darwin/Info.plist > .appstage/goder.app/Contents/Info.plist
        cp build/darwin/AppIcon.icns .appstage/goder.app/Contents/Resources/AppIcon.icns
        cp bin/goder-darwin-${ARCH} .appstage/goder.app/Contents/MacOS/goder
        cp bin/gh-darwin-${ARCH} .appstage/goder.app/Contents/MacOS/gh
        chmod +x .appstage/goder.app/Contents/MacOS/*
        (cd .appstage && zip -qry ../bin/goder-macos-${ARCH}.zip goder.app)
        echo "macos-${ARCH} goder-macos-${ARCH}.zip" >> bin/PUBLISH_MANIFEST
      done
      rm -rf .appstage
      # linux/windows 产物目录名与 gh 下载侧一致
      echo "$([ "$NATIVE_ARCH" = amd64 ] && echo linux || echo linux-arm64) goder-linux-${NATIVE_ARCH}.zip" >> bin/PUBLISH_MANIFEST
      echo "$([ "$CROSS_ARCH" = amd64 ] && echo linux || echo linux-arm64) goder-linux-${CROSS_ARCH}.zip" >> bin/PUBLISH_MANIFEST
      echo "windows goder-windows-amd64.zip" >> bin/PUBLISH_MANIFEST
      echo "windows-arm64 goder-windows-arm64.zip" >> bin/PUBLISH_MANIFEST
      ls -lh bin/
  artifacts:
    paths: [bin/]
    # 仅够 publish 消费,过期即清,少占 runner/GitLab 存储
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_TAG'

# -------------- 发布:按平台/版本目录 scp 产物 zip 到 10.8.0.5 --------------
publish:
  stage: publish
  tags:
    - home
  image: alpine:3.24
  before_script:
    # 使用国内 Alpine 源加速,并安装 ssh/scp(alpine 基础镜像不自带)
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # DEPLOY_SSH_PRIVATE_KEY 为文件类型变量,内容已在 $CI_PROJECT_DIR/$DEPLOY_SSH_PRIVATE_KEY
    # (运行时其值是该文件路径),复制到预期位置并清权限
    - cp "$DEPLOY_SSH_PRIVATE_KEY" ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # 版本号在 build 阶段经 scripts/version.sh 推算(跟随 grf-harness,
    # gh 不变时 .postN 递增),经 bin/VERSION 产物传过来
    - VERSION=$(cat bin/VERSION)
    # 产物清单由 build 阶段写入 bin/PUBLISH_MANIFEST(每行"目录 zip 名"),
    # 目录名与 gh 下载侧平台目录一致:macos-arm64 / macos / linux(-arm64) /
    # windows(-arm64)。注意 ssh 必须 -n 断开 stdin,否则会吃掉循环读的清单。
    - |
      while read -r DIR ZIP; do
        [ -n "$DIR" ] || continue
        ssh -n ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${DEPLOY_DIR}/${DIR}/${VERSION}"
        scp -p bin/$ZIP ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/${DIR}/${VERSION}/
      done < bin/PUBLISH_MANIFEST
  rules:
    - if: '$CI_COMMIT_TAG'
