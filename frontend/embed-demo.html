<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grf-harness-ui 嵌入演示</title>
    <style>
      /* 模拟三方宿主页面:自己的导航与品牌,仅嵌入 grf 的部分面板 */
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        background: #0f1014;
        color: #d7dae0;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .host-nav {
        height: 46px;
        background: #1b1c22;
        border-bottom: 1px solid #2a2d36;
        display: flex;
        align-items: center;
        padding: 0 18px;
        gap: 14px;
        font-size: 14px;
      }
      .host-nav .brand {
        font-weight: 700;
      }
      .host-nav .brand em {
        color: #4c8dff;
        font-style: normal;
      }
      .host-nav .note {
        color: #6b7080;
        font-size: 12px;
      }
      .embed-row {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      /* 完整 shell 嵌入:左导航/右栏/底栏条目由 registry 定制 */
      grf-app-shell {
        flex: 1;
        min-width: 0;
      }
      /* 演示 2:自由组合独立面板(勾掉 shell 只嵌部分面板的形态) */
      grf-session-list {
        width: 250px;
        flex: none;
      }
      grf-chat {
        flex: 1;
        min-width: 0;
      }
      grf-console {
        height: 170px;
        flex: none;
      }
      .with-console {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div class="host-nav">
      <span class="brand">三方应用 <em>Console</em></span>
      <span class="note"
        >本页演示:宿主顶栏 + grf-app-shell(经 registry 裁剪/新增左栏、右栏、底栏条目;?panels=free 切换自由组合形态)</span
      >
    </div>
    <div class="embed-row" id="host-shell">
      <!-- 默认:整套 shell(scope=demo),三方经 registry 定制 -->
      <grf-app-shell scope="demo" panels="sessions,chat,sidebar,console"></grf-app-shell>
    </div>
    <script type="module">
      // 引入嵌入库(全量副作用:注册全部通用面板 + 内置条目)
      import '/src/entries/embed.ts';
      import { configure, registry } from '/src/entries/embed.ts';
      import { html } from 'lit';

      const qs = new URLSearchParams(location.search);

      // 连接:默认走同源网关 /grf-api(多用户网关注入令牌;也可 ?server= 直连)
      configure('demo', {
        baseUrl: qs.get('server') ?? '/grf-api',
        token: qs.get('token') ?? '',
        // 身份区注入演示:左栏底部 chip 显示宿主用户,点击弹出宿主自绘面板
        user: {
          name: '演示用户',
          detail: 'demo-uid',
          panel: () => {
            const el = document.createElement('div');
            el.style.cssText = 'font-size:12.5px;line-height:1.8;color:#8b909c';
            el.innerHTML =
              '<div style="color:#d7dae0;font-weight:650;margin-bottom:6px">宿主用户面板</div>' +
              '<div>经 configure 的 user.panel 注入;资料/退出登录等放在这里。</div>';
            return el;
          },
        },
      });

      // ---- UI 定制演示:三方按需裁剪与新增 ----
      // 裁剪:隐藏内置「事件台」右栏条目
      registry.side.hide('console');

      // 新增:自定义右栏条目(拿 PanelContext:scope/store/当前会话)
      registry.side.add({
        id: 'about',
        label: '关于',
        icon: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="5.8"/><path d="M8 7.2v3.6" stroke-linecap="round"/></svg>',
        width: 320,
        render: (ctx) => html`
          <div style="padding:16px;font-size:12.5px;line-height:1.8;color:#8b909c">
            <div style="color:#d7dae0;font-weight:650;margin-bottom:6px">自定义右栏条目</div>
            <div>由宿主页面经 <code>registry.side.add()</code> 注册,渲染函数拿到当前 scope 数据域。</div>
            <div style="margin-top:8px">当前会话:${ctx.sessionId ?? '(未选择)'}</div>
            <div>连接状态:${ctx.store.connState}</div>
          </div>
        `,
      });

      // 新增:自定义左栏导航条目(点击宿主自己的切换按钮激活)
      registry.nav.add({
        id: 'host-help',
        label: '宿主帮助',
        order: 50,
        view: () => html`
          <div style="padding:16px;font-size:12.5px;line-height:1.8;color:#8b909c">
            <div style="color:#d7dae0;font-weight:650;margin-bottom:6px">自定义左栏导航</div>
            <div>经 registry.nav.add 注册;宿主可自绘切换 UI 调 shell.navTo('host-help')。</div>
          </div>
        `,
      });
      const shellBtn = document.createElement('button');
      shellBtn.textContent = '切到「宿主帮助」';
      shellBtn.style.cssText = 'margin-left:auto;background:#1b1c22;border:1px solid #2a2d36;color:#8b909c;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer';
      shellBtn.onclick = () => document.querySelector('grf-app-shell')?.navTo('host-help');
      document.querySelector('.host-nav')?.append(shellBtn);

      // ?panels=free:自由组合独立面板形态(不用 shell)
      if (qs.get('panels') === 'free') {
        registry.side.show('console');
        const host = document.getElementById('host-shell');
        if (host) {
          host.innerHTML = `
          <grf-session-list scope="demo" no-connection></grf-session-list>
          <div class="with-console">
            <grf-chat scope="demo"></grf-chat>
            <grf-console scope="demo"></grf-console>
          </div>`;
        }
      }
    </script>
  </body>
</html>
